name: SEO bot

# Daily: reads search news feeds and checks the live site. Emails only if something matters.
# Mondays: sends the weekly digest. Free (public repo), no AI, no paid APIs.
# Needs repo secrets TEKI_EMAIL and GMAIL_APP_PASSWORD.

on:
  schedule:
    - cron: "13 7 * * *"   # every day 07:13 UTC
  workflow_dispatch:
    inputs:
      digest:
        description: "Send the weekly digest now"
        type: boolean
        default: true

permissions:
  contents: write   # to save what the bot has already seen (.github/seo-bot/state.json)

concurrency:
  group: seo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read news, check site, email if needed
        env:
          TEKI_EMAIL: ${{ secrets.TEKI_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 .github/seo-bot/seo_bot.py run --site https://tekisolves.github.io ${{ inputs.digest && '--digest' || '' }}
      - name: Save state
        run: |
          git config user.name "seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seo-bot/state.json
          git diff --cached --quiet || git commit -m "seo-bot: update state [skip ci]"
          git push
