name: Build and deploy site

# Builds the site from source/ and publishes it to GitHub Pages.
# One-time setup:
#   1. Settings > Secrets and variables > Actions > New repository secret:
#      name TEKI_EMAIL, value = the contact email shown on the site.
#   2. Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: source
        env:
          TEKI_EMAIL: ${{ secrets.TEKI_EMAIL }}
        run: python3 build.py
      - name: SEO guard (blocks the deploy if a critical rule fails)
        run: python3 .github/seo-bot/seo_bot.py check --dist source/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  changelog:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record this deploy in SEO-CHANGELOG.md
        env:
          TEKI_EMAIL: ${{ secrets.TEKI_EMAIL }}
        run: |
          (cd source && python3 build.py)
          python3 .github/seo-bot/seo_bot.py check --dist source/dist > /tmp/check.txt || true
          git log -1 --format=%B > /tmp/msg.txt
          git diff --name-only HEAD^1 HEAD > /tmp/files.txt || true
          python3 .github/seo-bot/changelog.py --message-file /tmp/msg.txt --files-file /tmp/files.txt --check-file /tmp/check.txt
          git config user.name "seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SEO-CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "seo-log: record deploy [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page list
        working-directory: source
        env:
          TEKI_EMAIL: ${{ secrets.TEKI_EMAIL }}
        run: python3 build.py
      - name: Tell search engines what changed (IndexNow)
        run: python3 .github/seo-bot/seo_bot.py indexnow --dist source/dist --site https://tekisolves.github.io
