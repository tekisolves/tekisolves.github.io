      One shape, three tiers: Scrap, Military, Prototype.

      Every weapon in Retro Arsenal keeps the same pivot and muzzle point across its tiers, so upgrading in your game is just a frame swap. No re-aligning, no jumping sprites.

      Swipe through all 5 weapon types. Which tier would you give the player first?

      The laser pistol is free to try. Full pack in the link in bio.

