posts:
  facebook:
    text: |
      Try every weapon before you buy.

      I built a small Phaser 4 demo for Retro Arsenal. All five weapons work the way they should: the rifle auto-fires, the shotgun spreads, the blade swings and the grenade arcs and explodes. Press D to see every pivot and muzzle point.

      It runs in your browser, on phone or laptop:
      {link}

      The laser pistol is free if you want to use it in your own game.
