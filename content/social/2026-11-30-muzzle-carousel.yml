posts:
  instagram:
    text: |
      If your bullets come out of the player's fist, this one's for you.

      A sprite's position is its pivot, which for a gun is usually the grip. The fix is to store a muzzle point in your atlas, then scale and rotate the offset so it holds at any angle. The full function is on slide 3.

      Same trick works for blade tips, grenade pins and muzzle flashes.

      The free laser pistol sample already has the pivot and muzzle data in its JSON. Link in bio.

